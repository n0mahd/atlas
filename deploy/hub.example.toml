# Copy to ~/.config/atlas/hub.toml on the hub machine. deploy/install.sh writes one for you.
allowed_logins = ["you@github"]   # Tailscale logins allowed in (`tailscale whois $(tailscale ip -4)`)
knowledge = "~/Knowledge"         # your knowledge repo: AGENTS.md, skills/, memory/, hooks/, agents/
public_url = "https://hub.example.ts.net:7443"   # passkeys are tied to this address; leave out for read-only

# Optional:
# public_skills = "~/Skills"                  # a second, shareable repo of skills
# projects_dir = "~/Projects"                 # git repos here with agent files count as projects
# machines = ["laptop", "build-box"]          # other machines, listed until they pair
# socket = "/run/user/1000/atlas/hub.sock"    # default: $XDG_RUNTIME_DIR/atlas/hub.sock
# hub_name = "my-hub"                         # default: the hostname
# state_dir = "~/.local/state/atlas-hub"      # passkeys, updates, atlasd builds (dist/)
# first_run_minutes = 30   # how long after start the first passkey can be made in the browser
