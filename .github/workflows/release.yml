# Builds static Linux musl binaries (atlas-hub and atlasd) and macOS atlasd binaries,
# writes SHA256SUMS and build-provenance attestations, and attaches them to a draft
# GitHub release on v* tags. Actions are pinned by commit.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

jobs:
  build-linux:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - arch: aarch64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
      - name: Toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add "${{ matrix.target }}"
      - name: Build atlas-hub and atlasd
        run: cargo build --release --locked -p atlas-hub -p atlas-client --target "${{ matrix.target }}"
      - name: Stage binaries
        run: |
          mkdir -p out
          cp "target/${{ matrix.target }}/release/atlas-hub" "out/atlas-hub-linux-${{ matrix.arch }}"
          cp "target/${{ matrix.target }}/release/atlasd" "out/atlasd-linux-${{ matrix.arch }}"
          chmod 755 out/*
          file out/*
      - name: Upload binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-linux-${{ matrix.arch }}
          path: out/
          if-no-files-found: error

  build-macos:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add "${{ matrix.target }}"
      - name: Build atlasd
        run: cargo build --release --locked -p atlas-client --target "${{ matrix.target }}"
      - name: Stage binary
        run: |
          mkdir -p out
          cp "target/${{ matrix.target }}/release/atlasd" "out/atlasd-macos-${{ matrix.arch }}"
          chmod 755 out/*
          file out/*
      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-macos-${{ matrix.arch }}
          path: out/
          if-no-files-found: error

  package:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download built binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true
      - name: Package deploy archive and verify Linux binaries are static
        run: |
          chmod 755 dist/atlas-hub-linux-* dist/atlasd-*
          for bin in \
            dist/atlas-hub-linux-x86_64 \
            dist/atlas-hub-linux-aarch64 \
            dist/atlasd-linux-x86_64 \
            dist/atlasd-linux-aarch64; do
            info="$(file "$bin")"
            echo "$info"
            echo "$info" | grep -Eq 'statically linked|static-pie linked'
          done
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -czf dist/atlas-deploy.tar.gz \
            deploy/install.sh deploy/atlas-hub.service deploy/hub.example.toml
      - name: Write SHA256SUMS
        run: |
          (
            cd dist
            LC_ALL=C sha256sum \
              atlas-deploy.tar.gz \
              atlas-hub-linux-aarch64 \
              atlas-hub-linux-x86_64 \
              atlasd-linux-aarch64 \
              atlasd-linux-x86_64 \
              atlasd-macos-aarch64 \
              atlasd-macos-x86_64 > SHA256SUMS
          )
          cat dist/SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Upload release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atlas-release
          path: dist/
          if-no-files-found: error

  release:
    needs: [package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: atlas-release
          path: dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            dist/*
