{% extends "base.html" %}
{% block content %}
<div class="split">
  <article class="prose">{{ v.body_html|safe }}</article>
  <aside class="aside">
    <dl class="facts"><dt>File</dt><dd class="mono">{{ v.path }}</dd></dl>
    <h2 class="aside-head">Agents</h2>
    <ul class="chips stacked">
      {% for a in v.agents %}<li class="chip {{ a.class }}">{{ a.icon|safe }}<span class="chip-name">{{ a.name }}</span><span class="chip-state">{{ a.state }}</span></li>{% endfor %}
    </ul>
    <a class="link-cap" href="/instructions">All instructions</a>
  </aside>
</div>
{% endblock %}
