{% extends "base.html" %}
{% block content %}
<section class="signin" data-passkey data-next="{{ next }}">
  {% if first %}
  <p class="signin-lede">Add your first passkey. The setup code is in the hub's log: <span class="mono">journalctl --user -u atlas-hub</span>.</p>
  <label class="field"><span>Setup code</span><input class="search" name="code" autocomplete="one-time-code" required></label>
  <label class="field"><span>Name this passkey</span><input class="search" name="name" placeholder="Laptop, phone, security key…" maxlength="60"></label>
  <button class="button-ink" type="button" data-action="enrol">Create passkey</button>
  {% else %}
  <button class="button-ink" type="button" data-action="signin">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 18v3c0 .6.4 1 1 1h4v-3h3v-3h2l1.4-1.4a6.5 6.5 0 1 0-4-4Z"/><circle cx="16.5" cy="7.5" r=".5" fill="currentColor"/></svg>
    Sign in with a passkey</button>
  {% endif %}
  <p class="marginalia warn-note" data-error hidden role="alert"></p>
</section>
<script src="/static/passkey.js" defer></script>
{% endblock %}
