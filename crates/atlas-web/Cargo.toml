[package]
name = "atlas-web"
description = "The Atlas hub's web UI: axum, askama and htmx."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ammonia.workspace = true
askama.workspace = true
atlas-core = { path = "../atlas-core" }
atlas-fs = { path = "../atlas-fs" }
atlas-git = { path = "../atlas-git" }
atlas-harness = { path = "../atlas-harness" }
atlas-signer = { path = "../atlas-signer" }
atlas-verify = { path = "../atlas-verify" }
sha2 = "0.10"
axum.workspace = true
base64 = "0.23"
diffy = "0.5"
pulldown-cmark.workspace = true
# The same client and TLS (rustls, no OpenSSL) atlasd uses to reach the hub.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde.workspace = true
serde_json.workspace = true
uuid = { version = "1", features = ["v4"] }
tokio = { workspace = true, features = ["process", "time", "io-util"] }
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
tower.workspace = true

[lints]
workspace = true
