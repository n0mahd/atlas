[package]
name = "atlas-verify"
description = "Offline check that a release was approved by the owner's passkey (a WebAuthn assertion)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23"
ciborium = { version = "0.2", default-features = false, features = ["std"] }
ed25519-dalek = "3"
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"

[lints]
workspace = true
